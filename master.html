    class MoonStore {
      constructor() {
        this.channel = new BroadcastChannel('moon_whispers_channel_v2');
        this.state = this.loadState();
        
        this.channel.onmessage = (event) => {
          if (event.data && event.data.type === 'STATE_UPDATE') {
            this.state = event.data.payload;
            this.onStateChanged();
          }
        };

        window.addEventListener('storage', (e) => {
          if (e.key === 'moon_whispers_state_v2') {
            this.state = JSON.parse(e.newValue);
            this.onStateChanged();
          }
        });
      }

      loadState() {
        const saved = localStorage.getItem('moon_whispers_state_v2');
        if (saved) {
          try { return JSON.parse(saved); } catch(e) {}
        }
        return { ...defaultState };
      }

        const pill = document.getElementById('live-status-pill');
        if (pill) {
          pill.innerText = `STATUS: ${this.state.eventStatus} (CASE 0${this.state.currentCaseIndex + 1})`;
        }
        renderCurrentView();
      }
    }

    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      toggleMute() {
        this.muted = !this.muted;
        return this.muted;
      }
      playToneFreq(freq) {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      }
      playGlitch() {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, this.ctx.currentTime);
        osc.frequency.setValueAtTime(800, this.ctx.currentTime + 0.06);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
      }
    }

                </div>
                <div class="chat-msg-row flex items-start space-x-4 opacity-0 translate-y-6">
                  <div class="w-10 h-10 rounded-full bg-cyan-600/30 border border-cyan-500 flex items-center justify-center text-cyan-300 text-xs font-bold shrink-0">宣</div>
                  <div class="flex-1">
                    <span class="text-xs font-bold text-cyan-300">宣传组</span>
                    <div class="mt-1.5 bg-slate-800/80 p-4 rounded-2xl text-sm text-slate-200 border border-slate-700/50">在！刚才海报文件链接全失效了，是谁改了权限？</div>
                  </div>
                </div>
                <div class="chat-msg-row flex items-start space-x-4 opacity-0 translate-y-6">
                  <div class="w-10 h-10 rounded-full bg-purple-600/30 border border-purple-500 flex items-center justify-center text-purple-300 text-xs font-bold shrink-0">节</div>
                  <div class="flex-1">
                    <span class="text-xs font-bold text-purple-300">节目组</span>
                    <div class="mt-1.5 bg-slate-800/80 p-4 rounded-2xl text-sm text-slate-200 border border-slate-700/50">等等！节目单版本好像也被替换成旧版了，彩排流程对不上！</div>
                  </div>
                </div>
                <div class="chat-msg-row flex items-start space-x-4 opacity-0 translate-y-6">
                  <div class="w-10 h-10 rounded-full bg-red-600/30 border border-red-500 flex items-center justify-center text-red-300 text-xs font-bold shrink-0">技</div>
                  <div class="flex-1">
                    <span class="text-xs font-bold text-red-300">技术组</span>
                    <div class="mt-1.5 bg-slate-800/80 p-4 rounded-2xl text-sm text-slate-200 border border-slate-700/50">是谁把最终版 PPT 和音效控制库误删了？！</div>
                  </div>
                </div>
                <div class="chat-alert-box p-4 mt-6 bg-red-950/60 border border-red-500/50 rounded-2xl text-center text-red-300 font-mono text-xs opacity-0 scale-95">
                  <i class="fa-solid fa-triangle-exclamation mr-1 animate-pulse"></i> SYSTEM: MULTIPLE ANOMALIES CONFIRMED. INITIALIZING INVESTIGATION...
                </div>
              </div>
            </div>
          `;
          break;

        case 'CASE':
        case 'VOTING':
        case 'LIVE_RESULT':
          innerContent = renderMasterCaseSection(state, currentCase);
          break;

        case 'TECHNICAL_FAILURE':
          innerContent = `
            <div class="flex flex-col items-center justify-center text-center space-y-6 max-w-2xl mx-auto py-12 glitch-mode">
              <div class="text-red-500 text-7xl"><i class="fa-solid fa-tower-cell animate-pulse"></i></div>
              <div class="space-y-2">
                <span class="px-3 py-1 bg-red-950 text-red-400 border border-red-800 font-mono text-xs rounded-full">CRITICAL SIGNAL INTERRUPTION // CASE 04</span>
                <h1 class="text-3xl sm:text-5xl font-mono font-bold text-red-400 tracking-wider">MICROPHONE & SIGNAL LOST</h1>
                <p class="text-lg font-serif-sc text-slate-200">“喂？喂？现场音响失灵... 听得到我说话吗？！”</p>
              </div>
            </div>
          `;
          break;

        case 'UNLOCK':
          innerContent = `
            <div class="flex flex-col items-center justify-center text-center space-y-8 max-w-3xl mx-auto py-12 animate-fade-in">
              <span class="px-4 py-1.5 rounded-full bg-moonGold/20 border border-moonGold text-moonGold font-mono text-xs tracking-widest uppercase">
                <i class="fa-solid fa-lock-open mr-2"></i>DEPARTMENT DOSSIER UNLOCKED
              </span>
              <div class="w-48 h-48 sm:w-64 sm:h-64 rounded-full bg-gradient-to-tr from-amber-500/30 via-moonGold/50 to-cyan-400/30 moon-glow-large flex items-center justify-center border-2 border-moonGold">
                <div class="text-center px-4">
                  <i class="fa-solid fa-award text-4xl text-moonGold mb-2"></i>
                  <h2 class="text-3xl sm:text-5xl font-serif-sc font-bold text-white">${currentCase.dept}</h2>
                  <span class="block text-xs font-mono text-cyan-300 tracking-widest mt-2">${currentCase.deptEng}</span>
                </div>
              </div>
              <p class="text-xl sm:text-2xl font-serif-sc text-slate-100 italic max-w-xl">“${currentCase.revealDesc}”</p>
            </div>
          `;
          break;

        case 'FINAL_CASE':
          innerContent = `
            <div class="flex flex-col items-center justify-center text-center space-y-8 max-w-3xl mx-auto py-12 animate-fade-in">
              <span class="px-4 py-1 rounded-full bg-red-950 border border-red-500/50 text-red-400 font-mono text-xs tracking-widest">FINAL REVEAL // 终局推理</span>
              <h1 class="text-3xl sm:text-5xl font-serif-sc font-bold text-gold-gradient">“到底是谁导致了这场中秋筹备风波？”</h1>
              <p class="text-sm text-slate-200 font-serif-sc">经过前六轮的调查，七大部门的线索已拼接完成。请全场调查员做出最终判断。</p>
            </div>
          `;
          break;

        case 'FINAL_REVEAL':
          if (typeof confetti === 'function') confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
          innerContent = `
            <div class="flex flex-col items-center justify-center text-center space-y-8 max-w-4xl mx-auto py-6 animate-fade-in">
              <div class="relative w-full h-72 sm:h-96 flex items-center justify-center">
                <div class="absolute w-56 h-56 sm:w-72 sm:h-72 rounded-full bg-moonGold/20 moon-glow-large border border-moonGold/40 animate-pulse"></div>
                <div class="relative z-10 w-32 h-32 sm:w-44 sm:h-44 rounded-full bg-gradient-to-br from-amber-200 via-moonGold to-amber-600 flex flex-col items-center justify-center text-midnight font-bold shadow-2xl">
                  <span class="font-serif-sc text-3xl sm:text-4xl">月缘</span>
                </div>
              </div>
              <h2 class="text-2xl sm:text-4xl font-serif-sc font-light text-slate-100 leading-relaxed">
                “一场活动之所以完美，从来不是因为某一个人的努力。<br>而是因为每个人，都在自己的位置上，让月亮升起来。”
              </h2>
            </div>
          `;
          break;

        case 'RECRUITMENT':
          innerContent = `
            <div class="flex flex-col items-center justify-center text-center space-y-6 max-w-5xl mx-auto py-6 animate-fade-in">
              <span class="px-3 py-1 rounded-full bg-cyan-950 text-cyan-300 border border-cyan-800 font-mono text-xs">JOIN THE FAMILY // 招新开启</span>
              <h1 class="text-3xl sm:text-5xl font-serif-sc font-bold text-gold-gradient">加入马来西亚国立大学第47届中秋文娱晚会</h1>
            </div>
          `;
          break;
      }

      return `
        <div class="w-full min-h-[80vh] grid grid-rows-[auto_1fr_auto] p-4 sm:p-8 relative">
          <div class="flex items-center justify-between border-b border-slate-800/80 pb-4 relative z-10">
            <div class="flex items-center space-x-3">
              <div class="w-9 h-9 rounded-2xl bg-moonGold/20 border border-moonGold flex items-center justify-center text-moonGold font-serif-sc text-base font-bold">月</div>
              <div><h3 class="font-serif-sc text-base font-bold text-slate-100">月缘 MOON WHISPERS</h3></div>
            </div>
            <div class="flex items-center space-x-1.5 sm:space-x-2">
              ${CASE_DATA.map((c, idx) => `
                <div class="w-4 h-4 sm:w-5 sm:h-5 rounded-full border ${idx <= state.currentCaseIndex && state.eventStatus !== 'WAITING' ? 'bg-moonGold border-amber-200 text-midnight font-bold' : 'bg-slate-900 border-slate-800 text-slate-600'} flex items-center justify-center text-[9px] font-mono">
                  ${idx + 1}
                </div>
              `).join('')}
            </div>
          </div>
          <div class="flex items-center justify-center relative z-10">${innerContent}</div>
        </div>
      `;
    }

    function renderMasterCaseSection(state, currentCase) {
      const totalVotes = Object.values(state.votes).reduce((a, b) => a + b, 0) || 1;
      return `
        <div class="w-full max-w-4xl mx-auto space-y-6 animate-fade-in">
          <div class="glass-card p-6 sm:p-8 rounded-3xl border border-slate-800 space-y-4 relative">
            <span class="px-3.5 py-1 rounded-full bg-amber-950 text-amber-300 border border-amber-800 text-xs font-mono">${currentCase.code} // ${currentCase.title}</span>
            <h2 class="text-2xl sm:text-4xl font-serif-sc font-bold text-slate-100">${currentCase.question}</h2>
            <p class="text-sm sm:text-base text-slate-300 leading-relaxed">${currentCase.situation}</p>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${currentCase.options.map(opt => {
              const count = state.votes[opt.id] || 0;
              const pct = Math.round((count / totalVotes) * 100);
              const isCorrect = state.eventStatus === 'LIVE_RESULT' && opt.id === currentCase.correctAnswer;
              return `
                <div class="glass-card p-5 rounded-2xl border ${isCorrect ? 'border-moonGold bg-amber-950/30' : 'border-slate-800'} relative overflow-hidden">
                  <div class="absolute left-0 top-0 bottom-0 ${isCorrect ? 'bg-moonGold/30' : 'bg-slate-800/60'} transition-all duration-700" style="width: ${pct}%"></div>
                  <div class="relative z-10 flex items-center justify-between">
                    <span class="font-sans text-sm sm:text-base font-semibold text-slate-200">${opt.id}.${opt.label}</span>
                    <span class="text-lg font-bold font-mono ${isCorrect ? 'text-moonGold' : 'text-slate-300'}">${pct}%</span>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    let lastRenderKey = '';

    function runPostRenderAnimations() {
      const state = store.state;
      if (state.eventStatus === 'GROUP_CHAT') {
        const sysMsg = document.querySelector('.chat-sys-msg');
        const messages = document.querySelectorAll('.chat-msg-row');
        const alertBox = document.querySelector('.chat-alert-box');
        const tl = gsap.timeline();
        if (sysMsg) tl.to(sysMsg, { opacity: 1, duration: 0.8 }, "+=0.2");
        messages.forEach((msg) => {
          tl.to(msg, {
            opacity: 1, y: 0, duration: 0.7,
            onStart: () => {
              sound.playToneFreq(600 + (Math.random() * 300));
              const chatBox = document.getElementById('master-chat-box');
              if (chatBox) chatBox.scrollTop = chatBox.scrollHeight + 100;
            }
          }, `+=${0.7 + Math.random() * 1.5}`);
        });
        if (alertBox) tl.to(alertBox, { opacity: 1, scale: 1, duration: 0.6, onStart: () => sound.playGlitch() }, "+=1.5");
      }
    }

    function renderCurrentView() {
      const state = store.state;
      const currentKey = `${state.eventStatus}-${state.currentCaseIndex}`;
      const viewport = document.getElementById('app-viewport');
      if (!viewport) return;

      const newHTML = renderMasterView();

      if (lastRenderKey !== currentKey) {
        viewport.innerHTML = `<div id="transition-wrapper" class="w-full h-full flex flex-col justify-center opacity-0 translate-y-8">${newHTML}</div>`;
        gsap.to('#transition-wrapper', { opacity: 1, y: 0, duration: 0.8, ease: "expo.out", onComplete: runPostRenderAnimations });
        lastRenderKey = currentKey;
      } else {
        const wrapper = document.getElementById('transition-wrapper');
        if (wrapper && state.eventStatus !== 'GROUP_CHAT') wrapper.innerHTML = newHTML;
      }
    }

    window.onload = function() {
      const canvas = document.getElementById('star-canvas');
      if (canvas) {
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        const stars = Array(120).fill(0).map(() => ({ x: Math.random() * width, y: Math.random() * height, radius: Math.random() * 1.8, alpha: Math.random(), speed: 0.01 }));
        function draw() {
          ctx.clearRect(0, 0, width, height);
          stars.forEach(s => {
            s.alpha += s.speed;
            if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(248, 250, 252, ${Math.abs(s.alpha)})`;
            ctx.fill();
          });
          requestAnimationFrame(draw);
        }
        draw();
      }
      renderCurrentView();
    };
  </script>
</body>
</html>
